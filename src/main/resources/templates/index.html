<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>BookStore</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <!-- HEADER -->
    <header class="header">
        <div class="logo">📚 BookStore</div>

        <div class="nav-actions">
            <a th:href="@{/login}" class="btn ghost">Login</a>
            <a th:href="@{/app}" class="btn primary">Open App</a>
        </div>
    </header>

    <!-- HERO -->
    <section class="hero">

        <div class="hero-content">
            <h1>Discover Your Next Favorite Book</h1>
            <p class="subtitle">
                Modern bookstore experience powered by Spring Boot & React.
            </p>

            <div class="actions">
                <a th:href="@{/app}" class="btn primary">Start Exploring</a>
                <a th:href="@{/api/books}" class="btn ghost">API</a>
            </div>
        </div>

        <div class="hero-image">
            <img src="/images/hero-image.webp"
                 alt="Books">
        </div>

    </section>

    <!-- BOOKS -->
    <section class="books">

        <h2>Featured Books</h2>

        <div class="grid">
            <div class="card" th:each="book : ${books}">
                <h3 th:text="${book.name}">Book Name</h3>
                <p class="author" th:text="${book.author}">Author</p>
                <p class="price" th:text="'$' + ${book.price}">$10</p>
            </div>
        </div>

        <!-- PAGINATION -->
        <div class="pagination">

            <!-- Prev -->
            <a th:if="${currentPage > 0}"
               th:href="@{/(page=${currentPage - 1}, size=${size})}"
               class="btn ghost">
                ← Prev
            </a>

            <!-- Page numbers -->
            <span class="page-info">
                Page <span th:text="${currentPage + 1}">1</span>
                of <span th:text="${totalPages}">1</span>
            </span>

            <!-- Next -->
            <a th:if="${currentPage < totalPages - 1}"
               th:href="@{/(page=${currentPage + 1}, size=${size})}"
               class="btn ghost">
                Next →
            </a>

        </div>

    </section>

    <!-- FOOTER -->
    <footer class="footer">
        <p>© 2026 BookStore</p>
    </footer>

</div>

</body>
</html>
