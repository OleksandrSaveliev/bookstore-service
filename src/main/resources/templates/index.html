<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookStore | Home</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" href="data:,">
</head>
<body>

<header class="header">
    <div class="container header-inner">
        <a th:href="${frontendUrl} + '/'" class="logo">
            📚 <span class="logoText">BookStore</span>
        </a>

        <div class="navActions">
            <div class="langSwitch">
                <a th:href="@{/(lang='en')}" class="langBtn"
                   th:classappend="${#locale.language == 'en'} ? 'activeLang' : ''">EN</a>
                <a th:href="@{/(lang='ua')}" class="langBtn"
                   th:classappend="${#locale.language == 'ua'} ? 'activeLang' : ''">UA</a>
            </div>

            <div class="guestActions">
<!--                <a th:href="${frontendUrl} + '/login'" class="btn btn-ghost" th:text="#{nav.login}">Login</a>-->
                <a th:href="${frontendUrl}" class="btn btn-primary" th:text="#{nav.signup}">Join now</a>
            </div>
        </div>
    </div>
</header>

<main>
    <div class="container fade-in">
        <section class="hero">
            <div class="heroContent">
                <h1 th:utext="#{home.headline}">Discover Your Next Favorite Book</h1>
                <p class="subtitle" th:text="#{home.subtitle}">
                    Explore our collection of books and find your next great read.
                </p>
                <div style="display: flex; gap: 12px;">
                    <a th:href="${frontendUrl} + '/catalog'" class="btn btn-primary"
                       th:text="#{home.startExploring}">Start Exploring</a>
                </div>
            </div>
            <div class="heroImage">
                <img th:src="@{/images/hero-image.webp}" th:alt="#{home.heroAlt}">
            </div>
        </section>

        <section>
            <h2 class="sectionTitle" th:text="#{home.featured}">Featured Books</h2>

            <div class="grid">
                <a th:each="book : ${books}"
                   th:href="${frontendUrl} + '/app/books/' + ${book.id}"
                   class="book-card-link">

                    <div class="book-card">
                        <div class="book-card-info">
                            <h3 th:text="${book.name}">Book Title</h3>
                            <p class="book-author" th:text="${book.author}">Author Name</p>

                            <p class="book-genre" th:if="${book.genre != null}" th:text="${book.genre}">Genre</p>

                            <p class="book-price">
                                <span th:text="${book.price}">0.00</span> USD
                            </p>
                        </div>
                    </div>
                </a>
            </div>

            <div class="pagination" th:if="${totalPages > 1}">
                <a th:href="@{/(page=${currentPage - 1})}"
                   class="btn btn-ghost"
                   th:classappend="${currentPage == 0} ? 'disabled-link' : ''"
                   th:text="#{home.prev}">← Prev</a>

                <span class="page-info">
                    <span th:text="#{home.page}">Page</span>
                    <span th:text="${currentPage + 1}">1</span>
                    <span th:text="#{home.of}">of</span>
                    <span th:text="${totalPages}">1</span>
                </span>

                <a th:href="@{/(page=${currentPage + 1})}"
                   class="btn btn-ghost"
                   th:classappend="${currentPage + 1 >= totalPages} ? 'disabled-link' : ''"
                   th:text="#{home.next}">Next →</a>
            </div>
        </section>
    </div>
</main>

<footer class="footer">
    <p class="copyright">© 2026 BookStore Project</p>
    <div class="links">
        <a href="https://github.com" class="link">GitHub</a>
        <a th:href="@{/api/v1/books}" class="link">API Docs</a>
        <span class="link">EPAM Final Project</span>
    </div>
</footer>

</body>
</html>
